[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devin-cursorrules"
version = "0.1.0"
description = "CLI tool for Devin-like AI assistant capabilities"
authors = [
    { name = "Mehmet Oner Yalcin", email = "oneryalcin@gmail.com" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pydantic-settings>=2.7.1",
    "playwright>=1.41.0",
    "html5lib>=1.1",
    "duckduckgo-search>=7.2.1",
    "openai>=1.59.8",
    "anthropic>=0.42.0",
    "python-dotenv>=1.0.0",
    "google-generativeai",
    "grpcio==1.60.1",
    "keyring>=24.3.0"
]
requires-python = ">=3.9"

[project.scripts]
devin = "devin_cursorrules.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "black>=24.1.0",
    "unittest2>=1.1.0",
    "pytest-asyncio>=0.23.5"
]

[tool.hatch.build.targets.wheel]
packages = ["src/devin_cursorrules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=src/devin_cursorrules --cov-report=term-missing"

[tool.coverage.run]
source = ["src/devin_cursorrules"]
branch = true
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.25.3",
]
